<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aqua Noir</title>
<style>
  :root { --bg:#1b1b1b; --ink:#e9e9e9; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark; }
  html, body { height:100%; margin:0; background:var(--bg); overflow:hidden; }
  body { touch-action:none; user-select:none; -webkit-user-select:none; cursor:none; font-family:"Helvetica Neue",Arial,sans-serif; color:var(--ink); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #pct { position:fixed; left:0; right:0; bottom:calc(36px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:13px; letter-spacing:.12em; font-variant-numeric:tabular-nums; opacity:.7; }
  #dot { position:fixed; left:0; top:0; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:#fff; pointer-events:none; will-change:transform; mix-blend-mode:difference; }
  #pct { display:none; }
  #c2 { position:fixed; inset:0; width:100%; height:100%; opacity:0; pointer-events:none; z-index:1; }
  #hint, #bar, #dot { z-index:5; }
  #hint { position:fixed; left:0; right:0; top:86%; text-align:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; pointer-events:none; }
  #bar { position:fixed; left:50%; top:calc(86% + 7px); width:96px; margin-left:-48px; height:1px; background:#fff; transform-origin:center center; transform:scaleX(0); pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pct">Loading 0%</div>
<canvas id="c2"></canvas>
<div id="hint">Click &amp; hold</div>
<div id="bar"></div>
<div id="dot"></div>
<style>
  #intro { position:fixed; inset:0; z-index:20; background:#000; cursor:default; overflow:hidden; }
  #ibar { position:absolute; left:50%; top:50%; width:1px; height:0; transform:translate(-50%,-50%); background:#0b0b0b; }
  #idrop { position:absolute; left:50%; top:50%; width:26px; height:34px; margin:-17px 0 0 -13px; opacity:0; transform-origin:50% 100%; }
  #itrack, #iline { position:absolute; left:50%; top:calc(50% + 36px); height:1px; transform:translateX(-50%); }
  #itrack { width:450px; background:rgba(255,255,255,.14); opacity:0; }
  #iline { width:0; background:#fff; }
</style>
<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@400;500&display=swap'>
<style>
  :root { --serif:'Cormorant Garamond',Georgia,serif; --sans:Inter,'Helvetica Neue',Arial,sans-serif; }
  #dot { z-index:16; }
  #ui { position:fixed; left:0; right:0; top:0; z-index:6; display:flex; justify-content:space-between; align-items:center; padding:calc(22px + env(safe-area-inset-top,0px)) 28px 0; font:500 11px/1 var(--sans); letter-spacing:.22em; text-transform:uppercase; color:#fff; mix-blend-mode:difference; }
  #ui button { all:unset; color:#fff; font:inherit; letter-spacing:inherit; text-transform:inherit; }
  #disc { border-bottom:1px solid rgba(255,255,255,.5); padding-bottom:4px !important; }
  #hero { position:fixed; inset:0; z-index:3; display:grid; place-content:center; text-align:center; color:#fff; mix-blend-mode:difference; pointer-events:none; }
  #fx { position:fixed; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  #hero.fx #title { opacity:0; }
  #title { margin:0; font:300 italic clamp(40px,8.5vw,128px)/.95 var(--serif); transition:letter-spacing .25s, filter .25s; }
  .ln { display:block; white-space:nowrap; }
  .w { display:inline-block; opacity:0; animation:rise 1.3s cubic-bezier(.2,.8,.2,1) forwards; }
  .l { display:inline-block; transition:transform .3s; }
  @keyframes rise { from { opacity:0; transform:translateY(70px) rotate(8deg); filter:blur(14px); } to { opacity:1; transform:none; filter:blur(0); } }
  #sub { margin:34px auto 0; min-height:1.8em; font:400 11px/1.8 var(--sans); letter-spacing:.18em; text-transform:uppercase; opacity:.8; transition:opacity 1s, filter 1s, letter-spacing 1.4s; }
  #sub.out { opacity:0; filter:blur(8px); letter-spacing:.5em; }
  #chap { position:fixed; left:28px; bottom:calc(30px + env(safe-area-inset-bottom,0px)); z-index:3; color:#fff; mix-blend-mode:difference; opacity:0; transform:translateY(24px); transition:opacity .8s, transform .8s; pointer-events:none; }
  #chap.on { opacity:1; transform:none; }
  #chNum { font:500 11px/1 var(--sans); letter-spacing:.3em; text-transform:uppercase; }
  #chTitle { margin:8px 0 10px; font:300 italic clamp(44px,8vw,110px)/1 var(--serif); }
  #chNotes { margin:0; font:400 11px/1.6 var(--sans); letter-spacing:.2em; text-transform:uppercase; opacity:.85; }
  #menu { position:fixed; inset:0; z-index:15; display:flex; flex-direction:column; justify-content:center; padding:0 8vw; background:rgba(10,10,10,.96); color:#fff; opacity:0; pointer-events:none; transition:opacity .5s; }
  #menu.open { opacity:1; pointer-events:auto; }
  #tip { position:fixed; left:0; right:0; bottom:calc(34px + env(safe-area-inset-bottom,0px)); z-index:3; text-align:center; color:#fff; mix-blend-mode:difference; font:400 11px/1 var(--sans); letter-spacing:.24em; text-transform:uppercase; opacity:0; transition:opacity .4s; pointer-events:none; }
  #veil { position:fixed; inset:0; z-index:2; background:#000; opacity:0; pointer-events:none; }
  #holdTxt { position:fixed; left:0; right:0; top:50%; transform:translateY(-50%); z-index:4; text-align:center; color:#fff; font:300 30px/1 var(--sans); letter-spacing:.12em; opacity:0; pointer-events:none; }
  #menu h3 { margin:0 0 18px; font:500 11px/1 var(--sans); letter-spacing:.3em; text-transform:uppercase; opacity:.6; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:20px; padding:18px 0; border-bottom:1px solid rgba(255,255,255,.16); }
  .row b { font:300 italic clamp(34px,6.5vw,84px)/1 var(--serif); }
  .row span { font:400 11px/1.5 var(--sans); letter-spacing:.16em; text-transform:uppercase; opacity:.6; text-align:right; }
  #menu p { margin:28px 0 0; font:400 11px/1.7 var(--sans); letter-spacing:.18em; text-transform:uppercase; opacity:.6; }
</style>
<header id='ui'><span id='logo'>Aqua Noir</span><button id='disc'>Discover the collection</button><button id='menuBtn'>Menu</button></header>
<main id='hero'><h1 id='title'></h1><p id='sub' class='out'></p></main>
<div id='chap'><div id='chNum'></div><h2 id='chTitle'></h2><p id='chNotes'></p></div>
<div id='veil'></div><div id='holdTxt'></div><div id='tip'></div>
<nav id='menu'>
  <h3>The collection · Eau de parfum · 50 ml</h3>
  <div class='row'><b data-t='Essence'>Essence</b><span>I · Cold iris, vetiver,<br>a single drop of ink</span></div>
  <div class='row'><b data-t='Orchard'>Orchard</b><span>II · Black apple, moon salt,<br>cold glass</span></div>
  <div class='row'><b data-t='Fracture'>Fracture</b><span>III · Pink pepper, broken ice,<br>smoke</span></div>
  <p>Atelier — hello@aquanoir.example<br>Open by appointment, after midnight</p>
</nav>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const title = $('title'), sub = $('sub'), hero = $('hero'), chap = $('chap'), chN = $('chNum'), chT = $('chTitle'), chS = $('chNotes'), menu = $('menu'), btn = $('menuBtn'), disc = $('disc');
  const G = 'abcdefghijklmnopqrstuvwxyz*+/<>';
  const LINES = ['One drop,', 'after midnight.'];
  const SUB = 'A perfume house distilled from black apples, moon salt and cold glass.';
  // the tagline is shown one short phrase at a time: each blurs in with the letter-spacing tightening, rests, then blurs out
  const PH = ['A perfume house', 'distilled from black apples,', 'moon salt and cold glass.'];
  function cycleSub() {
    let i = 0;
    (function next() {
      sub.textContent = PH[i++ % PH.length]; sub.classList.remove('out');
      setTimeout(() => { sub.classList.add('out'); setTimeout(next, 1100); }, 2600);
    })();
  }
  const CH = [{ n: 'II — Orchard', t: 'The Orchard', s: 'Black apple · Moon salt · Cold glass' }, { n: 'III — Fracture', t: 'Fracture', s: 'Pink pepper · Broken ice · Smoke' }, { n: 'IV — Afterglow', t: 'Afterglow', s: 'Neon musk · Hot glass · Citrus flare' }];
  const veil = $('veil'), holdTxt = $('holdTxt'), tip = $('tip'); let lastTip = ''; let hT = 0, hLast = '', lastNow = performance.now();
  let letters = [], started = false, curMode = -1, mx = innerWidth / 2, my = innerHeight / 2;
  // text scramble: letters resolve left to right out of random glyphs
  function scr(el, txt, dur) { const s = performance.now(); (function f(n) { const p = Math.min(1, (n - s) / dur); let o = ''; for (let i = 0; i < txt.length; i++) o += (txt[i] === ' ' || i < p * txt.length) ? txt[i] : G[Math.random() * G.length | 0]; el.textContent = o; if (p < 1) requestAnimationFrame(f); })(s); }
  function build() {
    let html = '', k = 0;
    LINES.forEach(L => { html += `<span class='ln'>`; for (const c of L) html += `<span class='w' style='animation-delay:${(k++ * .05).toFixed(2)}s'><span class='l'>${c === ' ' ? '&nbsp;' : c}</span></span>`; html += '</span>'; });
    title.innerHTML = html; letters = [].slice.call(title.querySelectorAll('.l'));
  }
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  btn.addEventListener('click', () => menu.classList.toggle('open'));
  disc.addEventListener('click', () => menu.classList.add('open'));
  menu.addEventListener('click', e => { if (!(e.target.closest && e.target.closest('.row'))) menu.classList.remove('open'); });
  [].slice.call(document.querySelectorAll('.row b')).forEach(b => b.addEventListener('mouseenter', () => scr(b, b.dataset.t, 600)));
  function loop() {
    const st = window.__st || { mode: 0, mix: 0, prog: 0 };
    if (window.__introDone && !started) { started = true; build(); cycleSub(); }
    if (started) {
      // hero fades while you hold; letters spread apart and blur as the click is held
      hero.style.opacity = (1 - st.prog * .95) * (1 - Math.min(1, st.mix * 1.5));
      title.style.letterSpacing = (st.prog * .22) + 'em'; title.style.filter = 'blur(' + (st.prog * 7) + 'px)';
      letters.forEach(l => { const r = l.getBoundingClientRect(), d = Math.hypot(r.left + r.width / 2 - mx, r.top + r.height / 2 - my), k = Math.max(0, 1 - d / 200); l.style.transform = 'translateY(' + (-k * 18) + 'px) skewX(' + (-k * 14) + 'deg)'; });
      const want = st.mix > .6 ? st.mode : -1;
      if (want !== curMode) { curMode = want; if (want >= 0) { chN.textContent = CH[want].n; scr(chT, CH[want].t, 900); scr(chS, CH[want].s, 1500); chap.classList.add('on'); } else chap.classList.remove('on'); }
      btn.textContent = menu.classList.contains('open') ? 'Close' : 'Menu';
      // while holding: the page goes black and cycles Keep / Holding / On
      const nowT = performance.now(), dtl = Math.min(.1, (nowT - lastNow) / 1000); lastNow = nowT;
      hT = st.prog > .03 ? hT + dtl : 0;
      veil.style.opacity = Math.min(1, st.prog * 1.5) * (1 - st.mix);
      holdTxt.style.opacity = (hT > 0 ? Math.min(1, hT * 3) : 0) * (1 - st.mix);
      const hw = ['Keep', 'Holding', 'On'][Math.floor(hT / .9) % 3]; if (hT > 0 && hw !== hLast) { hLast = hw; holdTxt.textContent = hw; }
      // short instructions while the lighter scene is open
      const tipS = (st.mix > .6 && st.mode === 2) ? (window.__tip || '') : '';
      if (tipS !== lastTip) { lastTip = tipS; if (tipS) { tip.style.opacity = .9; scr(tip, tipS, 600); } else tip.style.opacity = 0; }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<div id='intro'>
  <div id="ibar"></div>
  <svg id="idrop" viewBox="0 0 26 34"><path id="idp" fill="#000" d="M13 1C13 1 25 15 25 22A12 12 0 0 1 1 22C1 15 13 1 13 1Z"/></svg>
  <div id="itrack"></div><div id="iline"></div>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const intro = $('intro'), bar = $('ibar'), drop = $('idrop'), dp = $('idp'), track = $('itrack'), line = $('iline');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const t0 = performance.now();
  function tick(now) {
    const t = (now - t0) / 1000;
    // 0-0.6s black -> grey; after the curtain (2.9s) the screen is dark grey
    const g = Math.round(34 * seg(t, .2, .6));
    intro.style.background = t > 2.9 ? '#111' : 'rgb(' + g + ',' + g + ',' + g + ')';
    // small drop fades in (black), flips to white as the curtain opens, falls onto the line at the end
    const dOp = seg(t, .6, 1.2), fall = ease(seg(t, 5.0, 5.4)), sc = .6 + .4 * dOp;
    drop.style.opacity = dOp * (1 - seg(t, 5.5, 5.8));
    drop.style.transform = 'translateY(' + (fall * 16) + 'px) scale(' + sc + ',' + (sc * (1 - .35 * fall)) + ')';
    dp.setAttribute('fill', t < 2.1 ? '#000' : '#fff');
    // thin vertical line grows, thickens into a bar, then widens to fill the screen
    bar.style.height = (ease(seg(t, 1.4, 1.9)) * 100) + '%';
    bar.style.width = (1 + 15 * ease(seg(t, 1.9, 2.4)) + innerWidth * ease(seg(t, 2.4, 2.9))) + 'px';
    // progress line grows from the centre under the drop, then collapses
    track.style.opacity = seg(t, 2.9, 3.2) * (1 - seg(t, 5.4, 5.7));
    line.style.width = (450 * ease(seg(t, 3.0, 5.2)) * (1 - ease(seg(t, 5.4, 5.8)))) + 'px';
    // reveal the droplet scene
    intro.style.opacity = 1 - seg(t, 5.9, 7.2);
    if (t > 6.5) window.__introDone = true;
    if (t < 7.3) requestAnimationFrame(tick); else intro.remove();
  }
  requestAnimationFrame(tick);
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* WebGL hero text: the title is drawn to a texture and bent by a shader.
   dissolve-in with a glowing edge, liquid ripples round the cursor, RGB split, glitch slices,
   pearlescent sheen, melting while you hold. Cosmic dust floats behind and flees the cursor. */
(function () {
  const hero = document.getElementById('hero');
  const cv = document.createElement('canvas'); cv.id = 'fx'; hero.insertBefore(cv, hero.firstChild);
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true }); } catch (e) { return; }   // no WebGL: the normal HTML title stays
  renderer.setClearColor(0x000000, 0);
  hero.classList.add('fx');
  const scene = new THREE.Scene(), cam = new THREE.Camera(), LINES = ['One drop,', 'after midnight.'];
  const tc = document.createElement('canvas'), tex = new THREE.CanvasTexture(tc); tex.minFilter = THREE.LinearFilter;
  const U = { tMap: { value: tex }, uT: { value: 0 }, uM: { value: new THREE.Vector2(.5, .5) }, uV: { value: 0 }, uHold: { value: 0 }, uRev: { value: 0 }, uAsp: { value: 1 }, uPx: { value: 1 } };
  const VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }';
  const FRAG = `uniform sampler2D tMap; uniform float uT, uV, uHold, uRev, uAsp; uniform vec2 uM; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h(i), h(i + vec2(1., 0.)), f.x), mix(h(i + vec2(0., 1.)), h(i + vec2(1., 1.)), f.x), f.y); }
    float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * n(p); p *= 2.1; a *= .5; } return s; }
    void main(){
      vec2 uv = vUv;
      float row = floor(uv.y * 38.);
      uv.x += step(.965, h(vec2(row, floor(uT * 7.)))) * (h(vec2(row, 3.)) - .5) * .06;                  // glitch slices
      vec2 d = (uv - uM) * vec2(uAsp, 1.); float r = length(d);
      uv += normalize(d + 1e-4) * sin(r * 38. - uT * 5.) * exp(-r * 5.) * (.02 + uV * .12);                // liquid ripple round the cursor
      uv.y += sin(uv.x * 9. + uT * 1.3) * .004 + uHold * fbm(uv * 4. + uT * .2) * .35;                       // breathing + melt while holding
      uv.x += (fbm(uv * 5. - uT * .15) - .5) * (.012 + uHold * .2);
      vec2 dir = normalize(d + 1e-4); float ca = .0015 + exp(-r * 4.) * (.004 + uV * .02) + uHold * .02;     // chromatic split
      float a1 = texture2D(tMap, uv + dir * ca).a, a2 = texture2D(tMap, uv).a, a3 = texture2D(tMap, uv - dir * ca).a;
      vec3 col = vec3(a1, a2, a3); float alpha = max(max(a1, a2), a3);
      float s = fbm(uv * 3. + uT * .08);
      vec3 irid = .5 + .5 * cos(6.2831 * (vec3(0., .33, .67) + s * 1.5 + uT * .05));                        // pearlescent sheen
      col = mix(col, col * irid * 1.6, .45);
      float nz = fbm(uv * 6.5 + 3.), th = uRev * 1.3 - .1;                                                  // dissolve-in
      float vis = 1. - smoothstep(th - .08, th, nz);
      float band = smoothstep(th - .12, th - .04, nz) * (1. - smoothstep(th - .04, th, nz));
      col += vec3(.45, .95, 1.) * band * alpha * 2.;
      gl_FragColor = vec4(col, alpha * vis);
    }`;
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ uniforms: U, transparent: true, depthTest: false, vertexShader: VERT, fragmentShader: FRAG }));
  scene.add(quad);
  // cosmic dust
  const N = 420, pos = new Float32Array(N * 3), seed = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos[i * 3] = Math.random() * 2 - 1; pos[i * 3 + 1] = Math.random() * 2 - 1; seed[i] = Math.random(); }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); pg.setAttribute('aS', new THREE.BufferAttribute(seed, 1));
  const dust = new THREE.Points(pg, new THREE.ShaderMaterial({ transparent: true, depthTest: false, blending: THREE.AdditiveBlending, uniforms: { uT: U.uT, uV: U.uV, uM: U.uM, uPx: U.uPx },
    vertexShader: `attribute float aS; uniform float uT, uV, uPx; uniform vec2 uM; varying float vA;
      void main(){ vec2 p = position.xy; p.y = mod(p.y + 1. + uT * (.01 + aS * .03), 2.) - 1.; p.x += sin(uT * .3 + aS * 40.) * .02;
        vec2 m = uM * 2. - 1.; vec2 d = p - m; float r = length(d * vec2(1.6, 1.)); p += normalize(d + 1e-4) * exp(-r * 6.) * (.08 + uV * .25);
        gl_Position = vec4(p, 0., 1.); gl_PointSize = (1.2 + aS * 4.) * uPx * (.6 + .4 * sin(uT * 2. + aS * 60.)); vA = .25 + .75 * aS; }`,
    fragmentShader: 'varying float vA; void main(){ float d = length(gl_PointCoord - .5); gl_FragColor = vec4(.8, .9, 1., (1. - smoothstep(0., .5, d)) * vA); }' }));
  dust.frustumCulled = false; scene.add(dust);
  function build() {
    const dpr = Math.min(devicePixelRatio || 1, 2), W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
    renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight, false); U.uPx.value = dpr; U.uAsp.value = W / H;
    tc.width = W; tc.height = H; const g = tc.getContext('2d'); g.clearRect(0, 0, W, H);
    const fs = Math.min(128, Math.max(40, innerWidth * .085)) * dpr;
    g.font = 'italic 300 ' + fs + 'px "Cormorant Garamond", Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    LINES.forEach((L, i) => g.fillText(L, W / 2, H / 2 - 27 * dpr + (i - .5) * fs * .95));
    tex.needsUpdate = true;
  }
  build(); addEventListener('resize', build);
  if (document.fonts && document.fonts.load) document.fonts.load('italic 300 64px "Cormorant Garamond"').then(build, () => {});
  let mx = innerWidth / 2, my = innerHeight / 2, px = mx, py = my, vS = 0, rs = -1;
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    vS += (Math.min(1, Math.hypot(mx - px, my - py) / 50) - vS) * .12; px = mx; py = my;
    U.uT.value = t; U.uV.value = vS; U.uM.value.set(mx / innerWidth, 1 - my / innerHeight);
    U.uHold.value = (window.__st && window.__st.prog) || 0;
    if (window.__introDone) { if (rs < 0) rs = t; U.uRev.value = Math.min(1, (t - rs) / 2.6); }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
window.__fail = e => { let d = document.getElementById('err'); if (!d) { d = document.createElement('pre'); d.id = 'err'; d.style.cssText = 'position:fixed;left:12px;top:12px;right:12px;z-index:9;color:#ff8a8a;font:12px monospace;white-space:pre-wrap;user-select:text'; document.body.appendChild(d); } d.textContent = 'Error: ' + ((e && e.message) || e); };
addEventListener('error', ev => window.__fail(ev.error || ev.message));
(function () {
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x1b1b1b);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
  camera.position.set(0, 0, 9);

  // Studio-style environment: dark room with a few hard white strips -> sharp mirror facets
  const ec = document.createElement('canvas'); ec.width = 1024; ec.height = 512;
  const g = ec.getContext('2d');
  g.fillStyle = '#050505'; g.fillRect(0, 0, 1024, 512);

  function stepLighter(dt, t) {
    tower.updateMatrixWorld(true); cam3.updateMatrixWorld(true);
    rc.setFromCamera(new THREE.Vector2(m.nx, m.ny), cam3); rc.ray.at(12, cursorW);
    const hit = rel ? null : rc.intersectObject(box)[0], lit = s3 > 3.5;   // the lighter starts off and flames up after a few seconds
    let tp, tq;
    if (hit) { const n = hit.face.normal.clone().transformDirection(box.matrixWorld); tp = hit.point.clone().addScaledVector(n, 1.3); tq = new THREE.Quaternion().setFromUnitVectors(UP, n.clone().negate()); }
    else { tp = rc.ray.at(11, new THREE.Vector3()); tq = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, -.35)); }
    lighter.position.lerp(tp, .25); lighter.quaternion.slerp(tq, .2);
    const f = lit ? 1 + Math.sin(t * 40) * .15 : (s3 > 2.6 && Math.random() < .3 ? .7 : 0);   // sputters before it catches
    flame.scale.set(f, f * (1 + Math.sin(t * 27) * .2), f); glow.scale.set(f, f, f);
    if (hit && lit) {
      burnAcc += dt; bT += dt;
      if (bT > .08) { bT = 0; const lp = box.worldToLocal(hit.point.clone()); if (!bpts.length || bpts[bpts.length - 1].p.distanceTo(lp) > .2) { bpts.push({ p: lp, r: .15 }); if (bpts.length > 20) bpts.shift(); } }
    }
    boxMat.uniforms.uP.value.forEach((v, i) => { const b = bpts[i]; if (b) { b.r = Math.min(.95, b.r + dt * .5); v.set(b.p.x, b.p.y, b.p.z, b.r); } else v.set(0, 0, 0, 0); });
    if (!rel && burnAcc > 6) { rel = true; relT = s3; }
    lighter.visible = !(rel && s3 - relT > 1);
    window.__tip = s3 < 3.5 ? 'The lighter is off…' : rel ? (s3 - relT > 2.2 ? 'One shape follows you — touch the others to throw them' : 'Release') : (burnAcc > .15 ? 'Keep the flame there' : 'Bring the flame to the box');
    if (rel) { const k = Math.min(1, (s3 - relT) / 1.2); boxMat.uniforms.uAll.value = k; if (k >= 1) box.visible = false; return 1 - Math.pow(1 - Math.min(1, Math.max(0, (s3 - relT - .4) / 6)), 3); }
    return 0;
  }

  // before release the shapes burst outward. afterwards they float free: ONE shape at a time chases the cursor,
  // and any other shape the cursor gets close to runs away from it
  function stepBits(ex, dt, t) {
    const fo = rel ? Math.min(1, Math.max(0, (s3 - relT - 1.2) / .8)) : 0;
    let curSpeed = 0;
    if (fo > 0) {
      cL.copy(cursorW); tower.worldToLocal(cL); curSpeed = dt > 0 ? cL.distanceTo(cP) / dt : 0; cP.copy(cL); foll.t += dt;
      if (foll.t > 5) {   // hand-over: the old follower is flung off, a new shape takes its place
        foll.t = 0; const ob = bits[foll.i].userData; if (ob.vel) { ob.vel.set((Math.random() - .5) * 10, (Math.random() - .5) * 8, (Math.random() - .5) * 4); ob.spin = 8; }
        foll.i = (foll.i + 1 + Math.floor(Math.random() * (bits.length - 1))) % bits.length;
      }
    }
    bits.forEach((o, i) => {
      const u = o.userData;
      const bx = u.b.x + u.d.x * ex, by = u.b.y + u.d.y * ex + Math.sin(t + u.sp.x * 6) * .15 * ex, bz = u.b.z + u.d.z * ex;
      if (!u.cur) u.cur = new THREE.Vector3(bx, by, bz);
      if (!u.off) u.off = new THREE.Vector3();
      if (fo > 0) {
        if (!u.free) { u.free = true; u.vel = u.d.clone().multiplyScalar(.25); u.spin = 0; }
        if (i === foll.i) {   // the chosen shape rides the cursor
          tmpV.set(cL.x, cL.y + Math.sin(t * 3) * .08, cL.z);
          u.cur.lerp(tmpV, Math.min(1, .14 * 60 * dt)); u.vel.set(0, 0, 0);
        } else {
          const dx = u.cur.x - cL.x, dy = u.cur.y - cL.y, dz = u.cur.z - cL.z, d = Math.hypot(dx, dy, dz) || 1;
          if (d < 1.3) {   // the cursor touches it: it is thrown away from the cursor, spinning
            const sp = 10 + Math.min(10, curSpeed * .5);
            let ax = dx, ay = dy, al = Math.hypot(ax, ay); if (al < .15) { const ang = Math.random() * 6.283; ax = Math.cos(ang); ay = Math.sin(ang); al = 1; }   // thrown across the screen, random way if hit dead-centre
            u.vel.set(ax / al * sp, ay / al * sp + 1.5, dz / d * sp * .25); u.spin = 8;
          }
          u.cur.addScaledVector(u.vel, dt);
          u.vel.multiplyScalar(Math.pow(.15, dt));
          u.vel.x += Math.sin(t * .6 + i) * .3 * dt; u.vel.y += Math.cos(t * .5 + i * 1.7) * .3 * dt;
          if (Math.abs(u.cur.x) > 7) { u.cur.x = Math.sign(u.cur.x) * 7; u.vel.x *= -.8; }
          if (Math.abs(u.cur.y) > 4.2) { u.cur.y = Math.sign(u.cur.y) * 4.2; u.vel.y *= -.8; }
          if (Math.abs(u.cur.z) > 3.5) { u.cur.z = Math.sign(u.cur.z) * 3.5; u.vel.z *= -.8; }
        }
        u.spin *= Math.pow(.2, dt);
      } else u.cur.set(bx, by, bz);
      o.position.copy(u.cur);
      o.rotation.x += u.sp.x * dt * (1 + fo * 2 + (u.spin || 0)); o.rotation.y += u.sp.y * dt * (1 + fo * 2 + (u.spin || 0));
    });
  }

  // Click & hold state
  let mode = 0, cycle = 0;
  let holding = false, prog = 0, done = false, mix = 0;
  addEventListener('pointerdown', e => { if (!window.__introDone || (e.target && e.target.closest && e.target.closest('#ui,#menu'))) return; holding = true; dot.style.width = dot.style.height = '6px'; });
  ['pointerup', 'pointercancel', 'blur'].forEach(e => addEventListener(e, () => { holding = false; dot.style.width = dot.style.height = '10px'; }));
  const hint = document.getElementById('hint'), bar = document.getElementById('bar');
  const pct = document.getElementById('pct');
  const t0 = performance.now();
  let last = t0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    const t = (now - t0) / 1000;

    // cursor velocity (px/frame-ish), smoothed
    const vx = (m.x - prev.x), vy = (m.y - prev.y);
    prev.x = m.x; prev.y = m.y;
    s.vx = lerp(s.vx, vx, 0.18); s.vy = lerp(s.vy, vy, 0.18);

    // Moving down/up: droplet tilts toward the motion and stretches like liquid
    const idle = reduce ? 0 : Math.sin(t * 0.8) * 0.08;
    s.spin += (reduce ? 0 : 0.35 * dt) + s.vx * 0.004;
    s.ry = lerp(s.ry, s.spin + m.nx * 0.6, 0.12);
    s.rx = lerp(s.rx, -m.ny * 0.55 + s.vy * 0.012 + idle, 0.08);
    s.stretch = lerp(s.stretch, Math.min(Math.abs(s.vy) * 0.012, 0.35) * Math.sign(-s.vy), 0.1);
    s.px = lerp(s.px, m.nx * 0.55, 0.06);
    s.py = lerp(s.py, m.ny * 0.45, 0.06);

    holder.position.set(0, 0, 0); uniT.value = t;
    holder.rotation.set(s.rx, s.ry, -s.vx * 0.006);
    holder.scale.set((1 - s.stretch * 0.4) * .82, (1 + s.stretch) * .82, (1 - s.stretch * 0.4) * .82);
    scene.environment && (renderer.toneMappingExposure = 1);

    // cursor dot follows a hair behind the real pointer
    dot.style.transform = `translate(${m.x}px, ${m.y}px)`;

    // placeholder loader counter (replace with real progress later)
    const fake = Math.min(100, Math.floor(((t % 6) / 6) * 100));
    pct.textContent = 'Loading ' + fake + '%';

    // hold progress -> line fills under the droplet; at 100% the puzzle scene shows for as long as the click is held
    if (!done) { prog = holding ? Math.min(1, prog + dt / 1.6) : Math.max(0, prog - dt / 0.6); if (prog >= 1) { done = true; mode = cycle++ % 3; s3 = 0; resetBurn(); sT = 0; spawnAcc = 0; shards = []; hits = 0; bgMix = 0; lastHitT = -9; } }
    else if (!holding) { done = false; prog = 0; }
    mix = done ? Math.min(1, mix + dt / 1.2) : Math.max(0, mix - dt / 0.7);
    bar.style.transform = 'scaleX(' + prog + ')';
    hint.style.opacity = 0.55 * (1 - prog) * (1 - mix);
    bar.style.opacity = 1 - mix;

    renderer.autoClear = true;
    if (mix < 1) {
      try {
        renderer.setRenderTarget(rt0); renderer.render(scene, camera); renderer.setRenderTarget(null);
        ab = lerp(ab, 0.004 + Math.min(Math.hypot(s.vx, s.vy) * 0.0006, 0.02), 0.1);
        abMat.uniforms.amt.value = ab; abMat.uniforms.tm.value = t % 10;
        renderer.render(abScene, quadCam);
      } catch (e) { window.__fail(e); renderer.setRenderTarget(null); renderer.render(scene, camera); }
    }
    if (mix > 0 && mode === 0) {
      cam2.position.x = lerp(cam2.position.x, m.nx * 1.6, 0.05);
      cam2.position.y = lerp(cam2.position.y, m.ny * 1.1, 0.05);
      cam2.lookAt(0, 0, -10);
      chain.forEach(o => o.rotation.set(Math.sin(t * .5) * .35, t * .8, 0));
      world.position.z = (t * 1.6) % 4; world.rotation.z = t * 0.05 + m.nx * 0.3;
      items.forEach(o => { o.rotation.y += o.userData.sp * dt; });
      moons.forEach(o => o.rotation.set(.3, t * .7, 0));
      fly.forEach(o => { const u = o.userData; u.z += u.sp * dt; if (u.z > 4) { u.z = -30; u.a = Math.random() * 6.28; } u.a += dt * .25; o.position.set(Math.cos(u.a) * u.rad, Math.sin(u.a) * u.rad, u.z); o.rotation.x += u.spin.x * dt; o.rotation.y += u.spin.y * dt; o.rotation.z += u.spin.z * dt; });
      renderer.setRenderTarget(rt); renderer.render(scene2, cam2); renderer.setRenderTarget(null);
      quadMat.uniforms.uMix.value = mix;
      renderer.autoClear = false; renderer.render(quadScene, quadCam); renderer.autoClear = true;
    }
    if (mix > 0 && mode === 2) {
      s3 += dt; tower.rotation.y = .5 + Math.sin(t * .3) * .25;
      cam3.aspect = innerWidth / innerHeight; cam3.position.set(0, 1.2, 14); cam3.lookAt(0, 0, 0); cam3.updateProjectionMatrix();
      const ex = stepLighter(dt, t);
      stepBits(ex, dt, t);
      renderer.setRenderTarget(rt); renderer.render(scene3, cam3); renderer.setRenderTarget(null);
      quadMat.uniforms.uFold.value = 0; quadMat.uniforms.uMix.value = mix;
      renderer.autoClear = false; renderer.render(quadScene, quadCam); renderer.autoClear = true;
      quadMat.uniforms.uFold.value = 1;
    }
    c2.style.opacity = mode === 1 ? mix : 0;
    window.__st = { mode, mix, prog };
    if (mode === 1 && mix > 0) stepShards(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
